title: AI Agents in Practice
tagline: A one-day course for NWO-I institutes
description: >-
  A one-day course on using AI agents in your work, for students, researchers
  and staff members of NWO-I institutes. Based on the CWI course AI Agents in
  Practice.
url: "https://nwoi-ai-agents-day.github.io"
baseurl: ""

event:
  edition: NWO-I edition
  institute: CWI Amsterdam
  date: Monday 7 December 2026
  time: "10:00–17:00"
  walk_in: "09:30"
  location: Euler room, CWI, Science Park 123, Amsterdam
  # Google Form. The register button appears because this is set.
  register_url: https://forms.gle/PRMFjTftkCkqrQjv9
  course_url: https://cwi-aiagents-lectures.github.io/
  instructors:
    - name: M. Bilgehan Ertan
      role: Main instructor
      title: PhD Student, AI Safety & Security
      group: Computer Security (CSY), CWI Amsterdam
      profile: https://bilgehanertan.github.io
      photo: /assets/img/people/ertan.jpg
    - name: Prof. Marten van Dijk
      role: Co-instructor
      title: Group Leader
      group: Computer Security (CSY), CWI Amsterdam
      profile: https://www.cwi.nl/en/people/marten-van-dijk/
      photo: /assets/img/people/van-dijk.jpg

defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
