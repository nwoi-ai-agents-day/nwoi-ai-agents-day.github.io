# The programme of the day. Used by the home page and the programme page.
# Times must match plans/nwoi-day-syllabus.md.
# kind: part, hands-on, discussion, closing, break, other

- time: "09:30–10:00"
  title: Walk-in, coffee and setup help
  kind: other
  format: Setup desk
  items:
    - Check that your agent is installed and that you are logged in.
    - Get help with the install if it does not work yet.

- time: "10:00–10:10"
  title: Welcome
  kind: other
  format: Show of hands
  items:
    - Who has used ChatGPT or Claude?
    - Who has used an agent?
    - Who installed one today?

- time: "10:10–11:00"
  label: Part 1
  title: How AI agents work
  kind: part
  format: Talk and live demo
  items:
    - From chatbot to agent. In a live demo, an agent reads a CSV file, makes a plot and checks its own output.
    - What a language model is. Why it can sound sure when it is wrong.
    - The agent loop. The agent reads, acts and looks at the result. The context window is its working memory.
    - Where it runs, what it costs and where your data goes. Which tool to start with.

- time: "11:00–11:20"
  label: Hands-on 1
  title: Your first agent task
  kind: hands-on
  format: Live on screen, follow along on your laptop
  items:
    - The presenter does each step live on the screen. You can do the same on your laptop if you want, or just watch.
    - The agent follows a handoff file. That is a file with instructions that the agent reads and follows.
    - It makes a project folder, loads a small public dataset, cleans it, makes one plot and explains the steps.
    - The agent asks before every step, so you see what it wants to do. The presenter comes round to help.

- time: "11:20–11:35"
  title: Coffee break
  kind: break

- time: "11:35–12:30"
  label: Part 2
  title: Working effectively with an agent
  kind: part
  format: Talk, one short whole-room exercise
  items:
    - A good task description. The goal, the context, the limits and what "done" looks like. Together we rewrite "analyse my data" into a good task.
    - Context and memory. Instruction files such as `CLAUDE.md` and `AGENTS.md`, and your own notes.
    - Tools and extensions, with Zotero as the example. When a tool helps and when it adds noise.
    - Steering and safety nets. Interrupting, correcting and going back to an earlier point. Git explained from zero as save points for a folder. Signs of trouble.

- time: "12:30–13:30"
  title: Lunch
  kind: break

- time: "13:30–14:15"
  label: Part 3
  title: Skills and safety
  kind: part
  format: Talk
  items:
    - Skills. A skill is a folder with a recipe. Skills can contain code, so check one before you install it.
    - Prompt injection. Data that reads like instructions.
    - Sandboxing. What a sandbox is, how it differs from approving each step, and what we recommend.
    - Your data. Unpublished, personal and partner data. What is sent to the model provider.

- time: "14:15–14:35"
  label: Hands-on 2
  title: Your first skill
  kind: hands-on
  format: Live on screen, follow along on your laptop
  items:
    - The presenter does each step live on the screen. You can do the same on your laptop if you want, or just watch.
    - The agent downloads `bilgehan.io/lit.md`, reads it and follows it.
    - It first asks for a research topic. Then it makes a literature-review skill. If you follow along, you give your own topic.
    - The presenter comes round to help.

- time: "14:35–15:25"
  label: Part 4
  title: Larger work, and checking the results
  kind: part
  format: Talk and live demo
  items:
    - Splitting a larger task into plan, do and check. What you keep for yourself.
    - Long work. Keeping track across sessions with progress files, and picking up the next day.
    - Typical failures. Invented citations, silent changes of scope, "done" when it is not, and agreeing with you. A live demo with a planted error. Does the agent find it? Do you?
    - Agents in research, with integrity. Disclosure, authorship, journal and funder rules, and confidentiality in peer review.

- time: "15:25–15:40"
  title: Coffee break
  kind: break

- time: "15:40–16:10"
  label: Discussion
  title: Agents in your research
  kind: discussion
  format: Open discussion, live demos
  items:
    - One discussion with the whole room, led by the presenter.
    - text: "Three questions to the room. A show of hands for each, then open discussion."
      sub:
        - Where would an agent help in your work?
        - Where would it be risky?
        - What rule would you set for your group?
    - The presenter runs one or two tasks from participants live on the screen. Data from participants only goes on screen if it is public.
    - Open Q&A.

- time: "16:10–16:40"
  label: Closing
  title: What to take home
  kind: closing
  format: Talk, Q&A
  items:
    - The day in four lines.
    - A checklist for your first week. Install and set your data-use settings. Do one real task with a good description. Make one skill. Check every result.
    - What to look out for. Costs, data, invented references and overconfidence.
    - Where to go next, and open questions.
    - Feedback form via QR code, and thanks.

- time: "16:40"
  title: Drinks
  kind: break
